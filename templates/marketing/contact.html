{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>Contact</h1>
    <p class="page-header-desc">Share feedback, ideas, or questions about NeuroAssist.</p>
  </div>
</div>
<article class="card">
  <div class="card-body">
    <form method="post" action="/contact" class="stack-md" style="gap:1rem">
      <div>
        <label class="form-label" for="name">Name</label>
        <input class="input" id="name" name="fromName" required autocomplete="name">
      </div>
      <div>
        <label class="form-label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div>
        <label class="form-label" for="message">Message</label>
        <textarea class="textarea" id="message" name="message" required></textarea>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:0.75rem;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" type="submit">Send message</button>
        {% if form_status %}
        <p class="small muted" aria-live="polite">{{ form_status }}</p>
        {% endif %}
      </div>
    </form>
  </div>
</article>
{% endblock %}
