<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>NeuroAssist</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      color:white;

      background:
        linear-gradient(
          rgba(4, 16, 35, 0.65),
          rgba(4, 16, 35, 0.78)
        ),
        url("assets/background.jpg");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    nav{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:28px 8%;

      background:rgba(0,0,0,0.18);
      backdrop-filter:blur(10px);
    }

    .logo{
      font-size:1.7rem;
      font-weight:800;
      letter-spacing:1px;
    }

    nav ul{
      display:flex;
      list-style:none;
      gap:30px;
    }

    nav a{
      text-decoration:none;
      color:white;
      font-weight:700;
      transition:0.2s ease;
    }

    nav a:hover{
      color:#ffb38a;
    }

    .hero{
      min-height:calc(100vh - 90px);

      display:flex;
      align-items:center;

      padding:0 8%;
    }

    .hero-card{
      max-width:680px;

      padding:50px;

      border-radius:28px;

      background:rgba(255,255,255,0.14);

      border:1px solid rgba(255,255,255,0.2);

      backdrop-filter:blur(14px);

      box-shadow:0 25px 70px rgba(0,0,0,0.35);
    }

    .tag{
      display:inline-block;

      margin-bottom:18px;

      padding:8px 16px;

      border-radius:999px;

      background:#ff7e42;

      font-size:0.85rem;
      font-weight:800;
    }

    h1{
      font-size:clamp(3rem, 7vw, 5.5rem);

      line-height:1;

      margin-bottom:24px;
    }

    p{
      font-size:1.15rem;

      line-height:1.7;

      margin-bottom:34px;

      max-width:560px;
    }

    .buttons{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;

      padding:14px 26px;

      border-radius:999px;

      font-weight:800;

      transition:0.25s ease;
    }

    .btn-primary{
      background:#ff7e42;
      color:white;
    }

    .btn-secondary{
      border:2px solid rgba(255,255,255,0.8);
      color:white;
    }

    .btn:hover{
      transform:translateY(-3px);

      box-shadow:0 12px 28px rgba(0,0,0,0.3);
    }

    @media(max-width:700px){

      nav{
        flex-direction:column;
        gap:16px;
      }

      nav ul{
        gap:18px;
        flex-wrap:wrap;
        justify-content:center;
      }

      .hero{
        padding:40px 6%;
      }

      .hero-card{
        padding:32px;
      }
    }

  </style>
</head>

<body>

  <nav>

    <div class="logo">
      NeuroAssist
    </div>

    <ul>
      <li><a href="index.html">Home</a></li>

      <li>
        <a href="app/captions.html">
          Live Captioning
        </a>
      </li>

      <li>
        <a href="help.html">
          Help
        </a>
      </li>
    </ul>

  </nav>

  <section class="hero">

    <div class="hero-card">

      <span class="tag">
        Accessible Communication
      </span>

      <h1>
        Helping every voice be heard.
      </h1>

      <p>
        NeuroAssist helps users communicate easier
        through accessible live captioning and supportive tools
        designed for real world conversations.
      </p>

      <div class="buttons">

        <a
          href="app/captions.html"
          class="btn btn-primary"
        >
          Start Captioning
        </a>

        <a
          href="help.html"
          class="btn btn-secondary"
        >
          Help Page
        </a>

      </div>

    </div>

  </section>

</body>
</html>
